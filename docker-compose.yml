version: '3.8'

services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      - PORT=3000
      - FRONTEND_URL=http://localhost
    expose:
      - "3000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
